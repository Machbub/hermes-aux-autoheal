name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        run: python -m pytest tests/ -q

      # examples/dashboard is optional surface: its tests skip when FastAPI (or
      # httpx, which starlette's TestClient needs) is absent, so without this
      # step they would silently never run anywhere. Installed AFTER the main
      # run, which therefore also proves the skip path works.
      - name: Test the dashboard example
        run: |
          pip install -e '.[dashboard]'
          python -m pytest tests/test_dashboard_example.py -q

      # The PyYAML fallback path is what most users hit before they read the
      # README, so it has to stay working — and it is easy to break by
      # accidentally depending on a ruamel-only API.
      - name: Test without ruamel (fallback path)
        run: |
          pip uninstall -y ruamel.yaml ruamel.yaml.clib
          python -m pytest tests/test_units.py tests/test_cli.py -q
